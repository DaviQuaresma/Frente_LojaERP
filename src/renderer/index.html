<!-- @format -->

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Vendas ERP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="fw-lighter p-2">v2.0.0</div>
    <div class="container py-5">
      <h1 class="text-center mb-4" id="tituloEmpresa">Painel de Vendas ERP</h1>

      <ul
        class="nav nav-tabs mb-4 justify-content-center"
        id="tabs"
        role="tablist"
      >
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="venda-tab"
            data-bs-toggle="tab"
            data-bs-target="#venda"
            type="button"
            role="tab"
          >
            🛒 Venda Manual
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="historico-tab"
            data-bs-toggle="tab"
            data-bs-target="#historico"
            type="button"
            role="tab"
          >
            📜 Histórico de Vendas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="config-tab"
            data-bs-toggle="tab"
            data-bs-target="#config"
            type="button"
            role="tab"
          >
            ⚙️ Configurações
          </button>
        </li>
      </ul>

      <div class="tab-content" id="tabsContent">
        <!-- Venda Manual -->
        <div
          class="tab-pane fade show active"
          id="venda"
          role="tabpanel"
          aria-labelledby="venda-tab"
        >
          <div class="card shadow p-4 mx-auto" style="max-width: 500px">
            <div class="mb-3">
              <label for="valor" class="form-label">Valores Alvo (R$)</label>
              <input
                id="valor"
                type="text"
                class="form-control"
                placeholder="Ex: 30, 40, 50"
              />
              <div class="form-text">Separe múltiplos valores com vírgula.</div>
            </div>

            <button id="botaoCriar" class="btn btn-primary w-100">
              Gerar Venda
            </button>
            <div id="resultado" class="mt-3 fw-bold text-center"></div>

            <!-- ⚠️ Bloco fixo para erros de estoque -->
            <div id="errosEstoque" class="mt-4 d-none">
              <div class="alert alert-warning">
                <h5 class="mb-3">⚠️ Produtos sem estoque suficiente:</h5>
                <div class="table-responsive">
                  <table class="table table-sm table-bordered">
                    <thead class="table-light">
                      <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Estoque atual</th>
                      </tr>
                    </thead>
                    <tbody id="tabelaSemEstoque"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Histórico de Vendas -->
        <div
          class="tab-pane fade"
          id="historico"
          role="tabpanel"
          aria-labelledby="historico-tab"
        >
          <div class="card shadow p-4">
            <h4 class="mb-3 text-center">Últimas Vendas Registradas</h4>
            <div class="table-responsive">
              <div class="d-flex justify-content-end mb-3 gap-2">
                <select id="filtroOrderBy" class="form-select">
                  <option value="data">Ordenar por Data</option>
                  <option value="total">Ordenar por Valor</option>
                  <option value="qtdItens">Ordenar por Itens</option>
                </select>
                <select id="filtroDirection" class="form-select">
                  <option value="desc">Descendente</option>
                  <option value="asc">Ascendente</option>
                </select>
              </div>
              <table class="table table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Total (R$)</th>
                    <th>Itens</th>
                    <th>Data</th>
                  </tr>
                </thead>
                <tbody id="tabelaVendas">
                  <tr>
                    <td colspan="4" class="text-center">
                      Carregando vendas...
                    </td>
                  </tr>
                </tbody>
              </table>
              <div
                class="d-flex justify-content-center mt-3"
                id="paginacaoContainer"
              ></div>
            </div>
          </div>
        </div>

        <!-- Configurações -->
        <div
          class="tab-pane fade"
          id="config"
          role="tabpanel"
          aria-labelledby="config-tab"
        >
          <div class="card shadow p-4">
            <h4 class="mb-4 text-center">⚙️ Configurações do Sistema</h4>

            <ul
              class="nav nav-pills mb-3 justify-content-center"
              id="subConfigTabs"
            >
              <li class="nav-item">
                <button
                  class="nav-link active"
                  id="tab-banco"
                  data-bs-toggle="pill"
                  data-bs-target="#abaBanco"
                  type="button"
                >
                  🔌 Conexão com Banco
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  id="tab-banco-ativo"
                  data-bs-toggle="pill"
                  data-bs-target="#abaBancoAtivo"
                  type="button"
                >
                  📂 Selecionar Banco Ativo
                </button>
              </li>
            </ul>

            <div class="tab-content" id="subConfigContent">
              <!-- Aba Banco -->
              <div class="tab-pane fade show active" id="abaBanco">
                <div class="mx-auto" style="max-width: 500px">
                  <!-- Dados de conexão -->
                  <div class="mb-3">
                    <label for="cfg-host" class="form-label">Host</label>
                    <input
                      id="cfg-host"
                      class="form-control"
                      placeholder="Ex: localhost"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="cfg-port" class="form-label">Porta</label>
                    <input
                      id="cfg-port"
                      class="form-control"
                      type="number"
                      placeholder="5432"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="cfg-user" class="form-label">Usuário</label>
                    <input
                      id="cfg-user"
                      class="form-control"
                      placeholder="postgres"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="cfg-password" class="form-label">Senha</label>
                    <input
                      id="cfg-password"
                      class="form-control"
                      type="password"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="cfg-database" class="form-label"
                      >Nome do Banco</label
                    >
                    <input
                      id="cfg-database"
                      class="form-control"
                      placeholder="demonstracao"
                    />
                  </div>

                  <!-- Token da API -->
                  <hr />
                  <div class="mb-3">
                    <label for="cfg-token" class="form-label"
                      >Token da API eGestor</label
                    >
                    <textarea
                      id="cfg-token"
                      class="form-control"
                      rows="3"
                      placeholder="Cole aqui o token JWT da API do eGestor"
                    ></textarea>
                  </div>

                  <!-- Botões de ação -->
                  <div class="d-grid gap-2">
                    <button id="btnTestarBanco" class="btn btn-outline-primary">
                      🧪 Testar e Salvar Conexão com Banco
                    </button>
                    <button
                      id="btnTestarTokenBanco"
                      class="btn btn-success w-100"
                    >
                      🔐 Testar e Salvar Token da API
                    </button>
                    <button id="btnSalvarTudo" class="btn btn-primary">
                      💾 Salvar Tudo (Banco + Token)
                    </button>
                  </div>

                  <!-- Status geral -->
                  <div
                    id="configStatus"
                    class="text-center fw-bold mt-3 text-muted"
                  ></div>
                </div>
              </div>

              <!-- Aba Selecionar Banco Ativo -->
              <div class="tab-pane fade show active" id="abaBancoAtivo">
                <div
                  class="mx-auto p-4 border rounded shadow-sm bg-white"
                  style="max-width: 500px"
                >
                  <h5 class="text-center mb-4 fw-semibold">
                    ⚙️ Configurações do Sistema
                  </h5>

                  <label for="selectBancoSalvo" class="form-label"
                    >Selecione um Banco Salvo</label
                  >
                  <select
                    id="selectBancoSalvo"
                    class="form-select mb-3"
                  ></select>

                  <button
                    id="btnAtivarBanco"
                    class="btn btn-success w-100 mb-3"
                  >
                    ✅ Ativar Banco Selecionado
                  </button>
                  <div
                    id="ativacaoStatus"
                    class="alert d-none text-center fw-semibold py-2"
                    role="alert"
                  ></div>

                  <hr class="my-4" />

                  <div class="d-grid gap-2">
                    <button
                      id="btnSyncProducts"
                      class="btn btn-outline-primary"
                    >
                      📦 Sincronizar Produtos com eGestor
                    </button>
                    <button id="cancelSync" class="btn btn-outline-danger">
                      ❌ Cancelar Sincronização
                    </button>
                  </div>

                  <div
                    id="syncStatus"
                    class="text-center fw-semibold mt-4 fade-transition"
                    style="opacity: 0; transition: opacity 0.3s ease"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="./index.js" defer></script>
  </body>
</html>

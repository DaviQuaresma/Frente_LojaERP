<!-- @format -->

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Vendas ERP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="fw-lighter p-2">v2.0.0</div>
    <div class="container py-5">
      <h1 class="text-center mb-4" id="tituloEmpresa">Painel de Vendas ERP</h1>

      <ul
        class="nav nav-tabs mb-4 justify-content-center"
        id="tabs"
        role="tablist"
      >
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="venda-tab"
            data-bs-toggle="tab"
            data-bs-target="#venda"
            type="button"
            role="tab"
          >
            🛒 Venda Manual
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="historico-tab"
            data-bs-toggle="tab"
            data-bs-target="#historico"
            type="button"
            role="tab"
          >
            📜 Histórico de Vendas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="config-tab"
            data-bs-toggle="tab"
            data-bs-target="#config"
            type="button"
            role="tab"
          >
            ⚙️ Configurações
          </button>
        </li>
      </ul>

      <div class="tab-content" id="tabsContent">
        <!-- Venda Manual -->
        <div
          class="tab-pane fade show active"
          id="venda"
          role="tabpanel"
          aria-labelledby="venda-tab"
        >
          <div class="card shadow p-4 mx-auto" style="max-width: 500px">
            <div class="mb-3">
              <label for="valor" class="form-label">Valores Alvo (R$)</label>
              <input
                id="valor"
                type="text"
                class="form-control"
                placeholder="Ex: 30, 40, 50"
              />
              <div class="form-text">Separe múltiplos valores com vírgula.</div>
            </div>

            <button id="botaoCriar" class="btn btn-primary w-100">
              Gerar Venda
            </button>
            <div id="resultado" class="mt-3 fw-bold text-center"></div>

            <!-- ⚠️ Bloco fixo para erros de estoque -->
            <div id="errosEstoque" class="mt-4 d-none">
              <div class="alert alert-warning">
                <h5 class="mb-3">⚠️ Produtos sem estoque suficiente:</h5>
                <div class="table-responsive">
                  <table class="table table-sm table-bordered">
                    <thead class="table-light">
                      <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Estoque atual</th>
                      </tr>
                    </thead>
                    <tbody id="tabelaSemEstoque"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Histórico de Vendas -->
        <div
          class="tab-pane fade"
          id="historico"
          role="tabpanel"
          aria-labelledby="historico-tab"
        >
          <div class="card shadow p-4">
            <h4 class="mb-3 text-center">Últimas Vendas Registradas</h4>
            <div class="table-responsive">
              <div class="d-flex justify-content-end mb-3 gap-2">
                <select id="filtroOrderBy" class="form-select">
                  <option value="data">Ordenar por Data</option>
                  <option value="total">Ordenar por Valor</option>
                  <option value="qtdItens">Ordenar por Itens</option>
                </select>
                <select id="filtroDirection" class="form-select">
                  <option value="desc">Descendente</option>
                  <option value="asc">Ascendente</option>
                </select>
              </div>
              <table class="table table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Total (R$)</th>
                    <th>Itens</th>
                    <th>Data</th>
                  </tr>
                </thead>
                <tbody id="tabelaVendas">
                  <tr>
                    <td colspan="4" class="text-center">
                      Carregando vendas...
                    </td>
                  </tr>
                </tbody>
              </table>
              <div
                class="d-flex justify-content-center mt-3"
                id="paginacaoContainer"
              ></div>
            </div>
          </div>
        </div>

        <!-- Configurações -->
        <div class="tab-pane fade" id="config" role="tabpanel">
          <div class="card shadow p-4">
            <h4 class="mb-4 text-center">⚙️ Gerenciador de Conexões</h4>

            <!-- Lista de Bancos Salvos -->
            <div id="listaBancos" class="mb-4">
              <!-- Será populado dinamicamente -->
            </div>

            <!-- Botões de ação -->
            <div class="d-grid gap-2 mb-4">
              <button class="btn btn-primary" id="btnNovaConexao">
                ➕ Nova Conexão
              </button>
              <button class="btn btn-outline-primary" id="btnSyncProducts">
                📦 Sincronizar Produtos com eGestor
              </button>
            </div>

            <!-- Status geral -->
            <div
              id="configStatus"
              class="text-center fw-bold mt-3 text-muted"
            ></div>
          </div>
        </div>

        <!-- Modal de Nova/Editar Conexão -->
        <div class="modal fade" id="modalConexao" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">🔌 Nova Conexão</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Fechar"
                ></button>
              </div>
              <div class="modal-body">
                <!-- Inputs -->
                <input
                  class="form-control mb-2"
                  id="input-name"
                  placeholder="Name"
                />
                <input
                  class="form-control mb-2"
                  id="input-host"
                  placeholder="Host"
                />
                <input
                  class="form-control mb-2"
                  id="input-port"
                  placeholder="Porta"
                  type="number"
                />
                <input
                  class="form-control mb-2"
                  id="input-user"
                  placeholder="Usuário"
                />
                <input
                  class="form-control mb-2"
                  id="input-password"
                  placeholder="Senha"
                  type="password"
                />
                <input
                  class="form-control mb-2"
                  id="input-database"
                  placeholder="Nome do Banco"
                />
                <textarea
                  class="form-control mb-2"
                  id="input-token"
                  rows="3"
                  placeholder="Token da API eGestor"
                ></textarea>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                  Cancelar
                </button>
                <button class="btn btn-success" id="btnSalvarConexao">
                  Salvar Conexão
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="./index.js" defer></script>
  </body>
</html>
